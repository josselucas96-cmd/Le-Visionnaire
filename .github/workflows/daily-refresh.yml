name: Daily holdings refresh

# Writes today's row in daily_holdings for each portfolio after US market
# close. Removes the dependency on visitor traffic that previously caused
# missing-day gaps (cf. the 2026-05-15 incident).

on:
  schedule:
    # 22:07 UTC every day (= 23:07 CH winter / 00:07 CH next day in summer).
    # ~1-2h after US market close on weekdays.
    # Runs Sat/Sun too because Nakamoto's benchmark (Bitcoin) trades 24/7 —
    # weekend rows propagate Friday's equity close so the portfolio line
    # stays aligned with the BTC line on the chart.
    # Minute 07 is off-peak to avoid GitHub Actions queue delays.
    - cron: '7 22 * * *'
    # Second pass the next morning. GitHub starts the evening run around
    # 00:20 UTC and Yahoo has often not published the day's closes by then;
    # that day is left unwritten and this run writes it once the closes are
    # out. Idempotent: rows already written are not rewritten.
    - cron: '30 9 * * *'

  # Allow manual trigger from the GitHub UI (Actions tab → Run workflow).
  # Useful to test or to manually catch up after a failed run.
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write is only for the monthly keepalive commit below.
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase yfinance pandas toml openpyxl

      - name: Run daily refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            python daily_refresh.py --date "${{ inputs.target_date }}"
          else
            python daily_refresh.py
          fi

      - name: Set up local secrets.toml for build_audit_workbook
        # build_audit_workbook.py reads secrets from .streamlit/secrets.toml.
        # In CI we don't have that file, so synthesize it from the env vars.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<EOF
          supabase_url = "$SUPABASE_URL"
          supabase_key = "$SUPABASE_KEY"
          EOF
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then
            echo "supabase_service_key = \"$SUPABASE_SERVICE_KEY\"" >> .streamlit/secrets.toml
          fi

      - name: Build audit workbook + upload to Supabase Storage
        run: python build_audit_workbook.py

      # GitHub silently disables scheduled workflows after 60 days without a
      # commit — that is what froze the site from 2026-09-01 (last commit
      # 2026-07-02). An empty commit on the 1st of each month resets that
      # clock. `if: always()` so a failing refresh step can't starve it.
      - name: Monthly keepalive commit (resets GitHub's 60-day inactivity timer)
        if: always() && github.event_name == 'schedule' && github.event.schedule == '7 22 * * *'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name  "specula-bot"
            git config user.email "specula-bot@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m) (scheduled workflows auto-disable after 60 idle days)"
            git push
          else
            echo "not the 1st of the month - skip"
          fi
