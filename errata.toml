[[entry]]
date   = "2026-09-19"
scope  = "All portfolios"
title  = "Alpha compared the portfolio and its benchmark on different dates"
what   = "The benchmark return was read at the latest price-feed date while the portfolio return was read at its latest ledger date. Harmless when both are current; misleading when the ledger lags (on 1 Sept: Visionnaire alpha shown +2.73%, same-date alpha +4.99%; Nakamoto shown −7.94%, same-date −3.91%)."
fix    = "Benchmark return and alpha are now read at the portfolio's latest ledger date."
impact = "Alpha figures changed on every page. Portfolio returns unchanged."
status = "closed"

[[entry]]
date   = "2026-09-19"
scope  = "All portfolios"
title  = "Volatility and VaR computed on a 7-day calendar"
what   = "The ledger holds a row for every calendar day (weekends carry Friday's close). Volatility and VaR were computed on that series (2/7 zero-return days) and annualised with √252, understating both by ~15%, while Sharpe on the same page used trading days only."
fix    = "All risk statistics use the equity trading calendar of the benchmark."
impact = "Visionnaire volatility 29.1% → 33.8%, VaR −2.82% → −3.26%; Bâtisseur 14.7% → 17.6% (15.2% after the 3 June fix); Nakamoto 52.5% → 63.4%."
status = "closed"

[[entry]]
