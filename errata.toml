# Public corrections & mistake log — rendered on /Methodology.
# One [[entry]] per correction, newest first. Never delete an entry.
# Fields: date, scope, title, what (what was wrong), fix (what was done),
#         impact (what changed in published figures), status.

[[entry]]
date   = "2026-09-23"
scope  = "All portfolios"
title  = "Ledger a full session behind on 21 and 22 September"
what   = "The data provider published its daily closing bars several hours later than usual (intraday prices were available, the daily bar was not). The nightly job, which GitHub had drifted to just after midnight UTC, found no close for its target day and carried the previous session forward — the behaviour that is correct for a weekend, wrong for a trading day. The row dated 21 September carries the closes of 18 September, and the row dated 22 September carries those of 21 September. Figures shown on 22 and 23 September are correct for one session earlier, and understate the portfolios by roughly 3-4%."
fix    = "The job now tells the two cases apart: a weekday whose close is not yet published leaves the day unwritten (a visible gap) instead of stamping stale prices on a real session. Filling holes was not enough either — a row written wrong exists, so nothing ever re-read it — so each run now also re-prices the last three sessions against their own closes and rewrites what does not match. The morning watchdog performs the same check independently and fails the run if it finds a mismatch. The 21 September row has been rebuilt with its own closes; 22 September was still unpublished at the time of writing and is rewritten automatically once it is."
impact = "No trade, share count or cash balance is affected; only the closing prices of two days. Corrected inception-to-date returns at 21 September: Le Visionnaire +25.10% (shown +20.33%), Le Bâtisseur +1.36% (shown -0.07%), Le Nakamoto +11.74% (shown +5.76%). Sharpe of Le Visionnaire 1.29 -> 1.54; max drawdown unchanged."
status = "open"

[[entry]]
date   = "2026-09-23"
scope  = "Le Visionnaire"
title  = "Benchmark compared from the wrong start date — alpha overstated by 12.6 points"
what   = "The benchmark was read as one column of the same price download as the twenty holdings and rebased on the first row that download returned. When the data provider answered that batch with a truncated column — nothing in the response says so — the Nasdaq 100 was rebased on 5 May instead of 10 April, the portfolio's own start date. The page then showed 'Nasdaq 100 +9.02%, Alpha +11.31%' where the correct figures at the same date were +21.60% and -1.27%. The same flaw applied to every page; the error was observed on Le Visionnaire, whose benchmark and alpha were the ones published wrong."
fix    = "Each benchmark is now downloaded on its own and validated before use: it must reach back to the portfolio's start date (or the last close before it, for a market holiday) and contain at least 80% of the sessions it spans. A benchmark that fails those checks is not displayed at all, and no alpha is shown, rather than a figure measured from the wrong day. Covered by regression tests."
impact = "No change to any portfolio figure: NAV, returns, drawdown and volatility were unaffected. The published benchmark and alpha of Le Visionnaire were wrong on 23 September; correct values at 21 September are Nasdaq 100 +21.60% and alpha -1.27%."
status = "closed"

[[entry]]
date   = "2026-09-21"
scope  = "Le Bâtisseur"
title  = "Two more rows rebuilt with a later book (9 and 11 June)"
what   = "A full reconciliation of every ledger day against the trade log (new as-of reconstruction) found two rows written by a late backfill with the book of the following day: 9 June held CoStar instead of VICI (switch of 10 June), 11 June held the post-reinforcement NOW position (trade of 12 June)."
fix    = "Both rows rewritten with the book of their own day at that day's closes. Backfills now reconstruct the book as of the target date from the trade log and are authoritative for the day (stale positions removed)."
impact = "9 June NAV +0.03%; 11 June NAV −0.84%. No change to month-end returns, inception-to-date return or max drawdown."
status = "closed"

[[entry]]
date   = "2026-09-19"
scope  = "All portfolios"
title  = "Site frozen for 18 days while announcing itself up to date"
what   = "GitHub disables scheduled jobs after 60 days without a commit. The nightly ledger writer stopped on 2026-09-01; the pages kept showing 'Last updated <today>' because that label reflected the price feed, not the ledger. Figures shown 1–19 Sept were correct for 30/31 Aug, not for the day of the visit."
fix    = "Ledger back-filled 31 Aug → 18 Sept from end-of-day closes; 'Last updated' now shows the ledger date; a visible warning appears when data is more than 3 days old; a monthly keep-alive commit and a daily independent watchdog (e-mail on failure) were added."
impact = "No historical figure changed. Live figures were stale for 18 days."
status = "closed"

[[entry]]
date   = "2026-09-19"
scope  = "Le Visionnaire"
title  = "Four ledger rows shifted by one day (27, 28, 31 Aug, 1 Sept)"
what   = "The nightly job, delayed by the scheduler past midnight UTC, wrote the previous day's closes under the current date."
fix    = "The four rows were rewritten with the correct closes. The job now targets the previous day whenever it starts before the US close."
impact = "Headline +20.92% shown on 1 Sept was the 31 Aug NAV. August monthly return +10.7% → +11.2%. Chart corrected on those four dates."
status = "closed"

[[entry]]
