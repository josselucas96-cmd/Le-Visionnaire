[[entry]]
date   = "2026-05-14"
scope  = "Le Visionnaire"
title  = "Performance history rewritten during a migration"
what   = "While moving to fund accounting (shares × close + cash), the NAV history was regenerated several times from the current book instead of the book of each day, briefly showing +13.23% instead of +20.45%."
fix    = "History rebuilt from dated snapshots; past rows have been immutable since. The same-day switch to fund accounting changed the published inception return from +20.45% to +20.05% (previous method mixed cost basis and market value)."
impact = "Inception return −0.40 pp at the time (method change, disclosed on LinkedIn)."
status = "closed"
