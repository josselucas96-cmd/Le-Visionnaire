market_comment = [
  "Bitcoin rallied more than 20% off its yearly low, including 22% in a single week to around $77,000. The trigger was macro rather than crypto-specific: the US Treasury moved to buy back bonds at the long end of the curve, and liquidity expectations repriced with it. A hawkish Jackson Hole speech from Fed governor Kevin Warsh took about 3.3% back late in the month.",
  "Treasury equities rebounded harder than the asset, reversing the pattern of June. The sector entered August after losing more than $80 billion of market value in thirteen months, with 43 of the 50 largest names trading below the price of their first bitcoin purchase — a base low enough that a change in direction produces violent moves.",
  "None of this repairs the model. A discount to net asset value still prevents accretive equity issuance, and a month of price recovery is not the same as the financing mechanism restarting.",
]

