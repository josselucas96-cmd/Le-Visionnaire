  "Le Visionnaire returned {pf_mtd_pct}% in June against {bench_mtd_pct}% for the {bench_pri_lbl}, a difference of {alpha_mtd_pct} percentage points. Cash at month-end was {cash_pct}%.",
  "Two sets of transactions were made. On 1 June, Amazon was sold in full at $265.23 and Zeta Global was opened at $24.52 for about 5% of the portfolio. On 12 June, Zeta was increased at $19.57 and Metaplanet at $1.53, in both cases after a decline in the share price and with the underlying view unchanged.",
  "Hims & Hers was the main contributor at 3.21 percentage points. The shares rose through the month as the company's direct access to branded weight-loss treatments gained traction, with more than 125,000 Wegovy shipments reported in the first six weeks, and after JPMorgan published a $32 price target. Nebius added 1.28 points and reached a 52-week high during the month.",
  "Rocket Lab was the largest detractor at 1.53 points, after losing about 25% in the first week of June following the Blue Origin launch failure and repositioning by investors ahead of the SpaceX IPO. Celsius cost 1.33 points and Metaplanet 1.13, the latter following bitcoin lower. Zeta cost 0.95 points, the shares having fallen about 20% between the two purchases, and Meta cost 0.89 points in line with the weakness in Communication Services. Beta for the month was 0.90, and the shortfall against the index came from these positions rather than from market exposure.",
